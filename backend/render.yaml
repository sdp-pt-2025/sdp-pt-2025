services:
  - type: web
    name: campus-study-buddy-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: FIREBASE_PROJECT_ID
        value: sd2025law
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: ./service-account.json
      - key: CORS_ORIGIN
        value: https://campus-study.vercel.app
