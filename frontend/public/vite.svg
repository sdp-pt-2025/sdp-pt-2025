<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="pageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  
  <!-- Book shadow -->
  <ellipse cx="128" cy="220" rx="100" ry="12" fill="url(#shadowGradient)"/>
  
  <!-- Left page -->
  <path d="M40 60 L40 180 Q40 190 50 190 L120 190 Q128 185 128 180 L128 65 Q128 60 120 60 Z" 
        fill="url(#pageGradient)" 
        stroke="#CBD5E1" 
        stroke-width="2"/>
  
  <!-- Right page -->
  <path d="M128 65 Q128 60 136 60 L206 60 Q216 60 216 70 L216 180 Q216 190 206 190 L136 190 Q128 185 128 180 Z" 
        fill="url(#pageGradient)" 
        stroke="#CBD5E1" 
        stroke-width="2"/>
  
  <!-- Book spine/binding -->
  <rect x="125" y="60" width="6" height="130" fill="url(#bookGradient)"/>
  <line x1="128" y1="60" x2="128" y2="190" stroke="#1E40AF" stroke-width="1"/>
  
  <!-- Left page content lines -->
  <line x1="55" y1="85" x2="110" y2="85" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="100" x2="105" y2="100" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="115" x2="108" y2="115" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="130" x2="100" y2="130" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="145" x2="110" y2="145" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Right page content lines -->
  <line x1="145" y1="85" x2="200" y2="85" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="145" y1="100" x2="195" y2="100" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="145" y1="115" x2="198" y2="115" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="145" y1="130" x2="190" y2="130" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="145" y1="145" x2="200" y2="145" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Study buddy indicator - small icons -->
  <circle cx="75" cy="165" r="8" fill="#3B82F6"/>
  <circle cx="74" cy="163" r="3" fill="white"/>
  <circle cx="76" cy="167" r="2" fill="white"/>
  
  <circle cx="180" cy="165" r="8" fill="#10B981"/>
  <circle cx="179" cy="163" r="3" fill="white"/>
  <circle cx="181" cy="167" r="2" fill="white"/>
  
  <!-- Connection line between study buddies -->
  <path d="M83 165 Q128 150 173 165" 
        stroke="#6B7280" 
        stroke-width="2" 
        stroke-dasharray="3,3" 
        fill="none"/>
</svg>